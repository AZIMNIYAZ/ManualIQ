<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Router Manual Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6ec;
    --accent: #2f6fde; --accent-text: #ffffff; --user: #e8f0fe; --notfound: #fff7e6; --notfound-border: #f5d48b;
    --error: #fdecec; --error-border: #f2b8b5; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #98a2b3; --border: #2c323d;
      --accent: #5b8ef0; --accent-text: #0b0e13; --user: #22304a; --notfound: #302813; --notfound-border: #6b5520;
      --error: #3a1c1c; --error-border: #7a3431; --chip: #262c37;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 860px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 200px; }
  header .sub { color: var(--muted); font-size: 13px; font-weight: normal; display: block; }
  select, button, textarea { font: inherit; color: var(--text); }
  select { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  button { cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); padding: 7px 12px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; white-space: pre-wrap; }
  .msg.notfound { background: var(--notfound); border-color: var(--notfound-border); }
  .msg.error { background: var(--error); border-color: var(--error-border); }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ol, .msg ul { margin: 4px 0 8px; padding-left: 22px; }
  .msg h3, .msg h4 { margin: 8px 0 4px; font-size: 15px; }
  .cite { font-size: 11px; background: var(--chip); border-radius: 4px; padding: 0 4px; margin-left: 1px; color: var(--muted); white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  details.sources { margin-top: 8px; font-size: 13px; }
  details.sources summary { cursor: pointer; color: var(--muted); }
  .source { margin: 6px 0 0; padding: 6px 8px; border-left: 3px solid var(--border); }
  .source .where { font-weight: 600; }
  .source .excerpt { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; margin: auto; max-width: 520px; }
  .empty ul { text-align: left; display: inline-block; margin: 8px 0 0; }
  .empty button { margin: 3px 0; text-align: left; }
  .thinking { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--border); }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--border); background: var(--panel); }
  @media (max-width: 560px) { .msg { max-width: 100%; } header h1 { font-size: 16px; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Router Manual Assistant
      <span class="sub">Answers only from the TP-Link, Netgear, ASUS, D-Link and Tenda manuals, with page citations</span>
    </h1>
    <label>Router:
      <select id="brand">
        <option value="">Any (detect from question)</option>
        <!--BRAND_OPTIONS-->
      </select>
    </label>
    <button id="new" type="button" title="Forget this conversation and start again">New conversation</button>
  </header>

  <div id="messages" aria-live="polite">
    <div class="empty" id="empty">
      <p>Ask a question about your router. Follow-up questions remember the conversation.</p>
      <ul>
        <li><button type="button" class="example">How do I set up a guest network on my Tenda router?</button></li>
        <li><button type="button" class="example">How do I reset my Netgear router to factory settings?</button></li>
        <li><button type="button" class="example">How do I set up port forwarding?</button></li>
      </ul>
    </div>
  </div>

  <form id="form">
    <textarea id="input" placeholder="Type your question… (Enter to send, Shift+Enter for a new line)" maxlength="1000" rows="1" required></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</div>

<script>
(() => {
  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const brand = document.getElementById("brand");
  let sessionId = null;  // kept in memory only: reloading the page starts a new conversation
  let busy = false;

  // Everything shown comes from the API (manual text and model output), so it is escaped
  // first and only a small, safe subset of Markdown is turned back into HTML.
  const escape = (s) => s.replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const inline = (s) => escape(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');

  function markdown(text) {
    const out = [];
    let list = null;  // "ol" | "ul" | null
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      let m;
      if (!line) { close(); continue; }
      if ((m = line.match(/^#{1,4}\s+(.*)$/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
      if ((m = line.match(/^(?:\d+[.)]|Step\s+\d+)\s+(.*)$/i))) {
        if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; }
        out.push(`<li>${inline(m[1])}</li>`); continue;
      }
      if ((m = line.match(/^[-*•]\s+(.*)$/))) {
        if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; }
        out.push(`<li>${inline(m[1])}</li>`); continue;
      }
      close();
      out.push(`<p>${inline(line)}</p>`);
    }
    close();
    return out.join("");
  }

  function add(cls, html) {
    document.getElementById("empty")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerHTML = html;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function renderAnswer(r) {
    let html = r.found_in_documents ? markdown(r.answer) : `<p>${escape(r.answer)}</p>`;
    if (r.sources && r.sources.length) {
      html += `<details class="sources" open><summary>Sources (${r.sources.length})</summary>` +
        r.sources.map((s) => `<div class="source"><span class="where">[${s.refs.join("][")}] ${escape(s.citation)}</span>` +
          (s.section ? ` · ${escape(s.section)}` : "") +
          `<div class="excerpt">${escape(s.excerpt)}</div></div>`).join("") + "</details>";
    }
    const notes = [];
    if (r.rewritten_query) notes.push(`Understood as: “${escape(r.rewritten_query)}”`);
    if (r.fallback && r.fallback.answered) notes.push("Found after searching again with the manual's terms");
    if (r.filters && r.filters.brands && r.filters.brands.length) notes.push(`Manual: ${r.filters.brands.map(escape).join(", ")}`);
    if (r.timings_ms && r.timings_ms.total) notes.push(`${(r.timings_ms.total / 1000).toFixed(1)} s`);
    if (notes.length) html += `<div class="meta">${notes.join(" · ")}</div>`;
    return html;
  }

  async function ask(question) {
    if (busy || !question.trim()) return;
    busy = true; send.disabled = true;
    add("user", escape(question));
    const pending = add("bot", '<span class="thinking">Searching the manuals…</span>');
    const body = {message: question};
    if (sessionId) body.session_id = sessionId;
    if (brand.value) body.brand = brand.value;
    try {
      const res = await fetch("/api/v1/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const msg = data && data.error ? data.error.message : `The server answered ${res.status}.`;
        pending.className = "msg error";
        pending.innerHTML = `<p><strong>Something went wrong.</strong> ${escape(msg)}</p>`;
      } else {
        sessionId = data.session_id;
        pending.className = "msg " + (data.found_in_documents ? "bot" : "notfound");
        pending.innerHTML = renderAnswer(data);
      }
    } catch (e) {
      pending.className = "msg error";
      pending.innerHTML = "<p><strong>Could not reach the server.</strong> Is the API running?</p>";
    } finally {
      busy = false; send.disabled = false; input.focus();
      messages.scrollTop = messages.scrollHeight;
    }
  }

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value; input.value = ""; ask(q);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
  });
  document.getElementById("new").addEventListener("click", () => {
    sessionId = null;
    messages.innerHTML = "";
    add("bot", "<p>New conversation started. Earlier messages are forgotten.</p>");
    input.focus();
  });
  document.querySelectorAll(".example").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
  input.focus();
})();
</script>
</body>
</html>
